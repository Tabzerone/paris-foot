name: Mise Ã  jour quotidienne
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python paris_foot.py site
      - name: Publier la page
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Mise Ã  jour" || echo "Rien de neuf"
          git push
